name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  go:
    name: go vet, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install libsanlock-dev
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsanlock-dev
      - run: go vet ./...
      - run: go test ./...
      - name: Build
        run: go build -ldflags "-X main.version=$(git describe --tags --always --dirty)" -o bin/nox ./cmd/nox
      - run: ./bin/nox version
      - uses: actions/upload-artifact@v4
        with:
          name: nox-linux-amd64
          path: bin/nox
      - name: Build Debian package
        run: ./deploy/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: nox-deb
          path: dist/*.deb
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.deb --title "nox ${GITHUB_REF_NAME}" --generate-notes || gh release upload "${GITHUB_REF_NAME}" dist/*.deb --clobber

  perl:
    name: perl -c NoxPlugin.pm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: perl -I test/pve-stubs -c pve/NoxPlugin.pm
